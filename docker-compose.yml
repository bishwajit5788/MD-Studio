version: "3.8"

services:
  # 1. Next.js Professional Workstation Frontend
  moodaudio-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moodaudio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://moodaudio-api:8000
    depends_on:
      - moodaudio-api

  # 2. MoodAudio FastAPI Backend & Audio Processing Engine
  moodaudio-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodaudio-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - PRODUCT_NAME=MoodAudio Studio
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - FRONTEND_ORIGIN=http://localhost:3000
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/moodaudio
      - STORAGE_BACKEND=local
      - DOWNLOADS_DIR=/app/downloads
      - BGUTIL_BASE_URL=http://bgutil-provider:4416
      - EXTRACTION_MODE=local
      - MAX_UPLOAD_SIZE_MB=100
      - MAX_AUDIO_DURATION_SECONDS=3600
      - JOB_TIMEOUT_SECONDS=600
    volumes:
      - moodaudio-downloads:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
      bgutil-provider:
        condition: service_started

  # 3. Persistent PostgreSQL Database (Railway Compatible)
  postgres:
    image: postgres:16-alpine
    container_name: moodaudio-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=moodaudio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moodaudio"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. BgUtils PO Token Provider (Node.js runtime for YouTube BotGuard attestation)
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: moodaudio-bgutil-provider
    restart: unless-stopped
    ports:
      - "127.0.0.1:4416:4416"

volumes:
  moodaudio-downloads:
    driver: local
  postgres-data:
    driver: local
