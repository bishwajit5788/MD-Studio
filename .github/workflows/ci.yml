name: EchoNode CI / CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_live_e2e:
        description: "Run live end-to-end extraction against YouTube"
        required: false
        default: false
        type: boolean

jobs:
  architecture-and-backend-tests:
    name: Architecture Audits & Backend Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx

      - name: Authoritative Pinout & Dependency Audit
        run: |
          python tools/audit_pin_mappings.py

      - name: Partition Alignment & Boundary Check
        run: |
          python tools/check_partitions.py firmware/partitions_16MB.csv

      - name: Run Job Store Persistence & Lifecycle Tests
        run: |
          python backend/tests/test_job_store.py

      - name: Run Storage Adapter Tests
        run: |
          python backend/tests/test_storage.py

      - name: Run Backend Unit Tests
        run: |
          python backend/tests/test_backend.py

      - name: Run Audio-Only Video Rejection Tests
        run: |
          python backend/tests/test_audio_only.py

      - name: Run Phase 7 Pipeline Verification Tests
        run: |
          python backend/tests/test_phase7_verification.py

      - name: Run All 22 Mandatory Requirements Verification
        env:
          ECHONODE_WORKER_TOKEN: "development-insecure-token-change-in-production"
        run: |
          python backend/tests/test_all_22_requirements.py

      - name: Run MoodAudio Studio v1 Service & API Suite
        run: |
          pytest -v backend/tests

      - name: Run Audio Tone Generator
        run: |
          python tools/generate_test_tones.py

      - name: Test MicroSD Validator CLI
        run: |
          python tools/sd_card_verifier.py --help

  frontend-build:
    name: Next.js Frontend Verification & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify TypeScript & Build Next.js Production Bundle
        working-directory: frontend
        run: npm run build

  firmware-syntax-check:
    name: Firmware PlatformIO Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PlatformIO Core
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

      - name: Set up Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: |
          pip install --upgrade platformio

      - name: Verify Hardware Diagnostics Compilation
        working-directory: firmware
        run: |
          pio run -e diagnostics

      - name: Verify Production Round LCD Firmware Compilation
        working-directory: firmware
        run: |
          pio run -e waveshare_esp32s3_round

  live-youtube-extraction-e2e:
    name: Opt-in Live YouTube Extraction E2E Test
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.run_live_e2e == 'true' || github.event.inputs.run_live_e2e == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Live YouTube Extraction Verification
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          EXTRACTION_MODE: local
        run: |
          python backend/tests/test_extraction_live.py
